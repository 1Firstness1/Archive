server.port=0

spring.application.name=archive-backend-test

# H2 in-memory Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway отключен в тестах (H2 schema generated via ddl-auto create-drop)
spring.flyway.enabled=false

# JWT configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=86400000

app.cors.allowed-origins=*

app.init.admin.login=admin
app.init.admin.password=admin123
app.init.admin.name=Тестовый Администратор
app.init.admin.email=admin@test.ru
