server.port=${SERVER_PORT:8080}

spring.application.name=archive-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:archive_db}
spring.datasource.username=${DB_USER:artem}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Учетные данные для инициализации из .env
app.init.admin.login=${INIT_ADMIN_LOGIN:admin}
app.init.admin.password=${INIT_ADMIN_PASSWORD:admin123}
app.init.admin.name=${INIT_ADMIN_NAME:Администратор Архива}
app.init.admin.email=${INIT_ADMIN_EMAIL:admin@mirea.ru}
